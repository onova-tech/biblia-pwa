<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="/biblia-pwa/manifest.json" />
        <link type="text/css" href="/biblia-pwa/css/materialize.min.css" rel="stylesheet">
        <link type="text/css" href="/biblia-pwa/css/styles.css" rel="stylesheet">
        <link type="text/css" href="/biblia-pwa/css/fonts.css" rel="stylesheet">
        <script type="text/javascript" src="/biblia-pwa/js/service_worker_enabler.js"></script>
        <script type="text/javascript" src="/biblia-pwa/js/utils.js"></script>
        <script type="text/javascript" src="/biblia-pwa/pages/js/chapter_selection.js"></script>
        <link rel="icon" type="image/x-icon" href="/biblia-pwa/fav/bible.32.png" />
    </head>
    <body>
        <div id="content">
            <div class="navbar-fixed">
                <nav>
                    <div class="nav-wrapper blue navbar_spacing">
                        <a href="/biblia-pwa/index.html" class="brand-logo center ancizar-sans-font"><i class="material-icons">book</i>Bíblia</a>
                        <a href="#" data-target="mobile-menu" class="sidenav-trigger"><i class="material-icons">menu</i></a>
                        <ul class="right hide-on-med-and-down">
                            <li><a onclick="load_random_chapter();" class="btn">Capítulo do Dia</a></li>
                            <li>
                                <a id="search-icon-btn" href="#" class="btn-floating btn-small lighten-2 blue">
                                    <i class="material-icons">search</i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>

            <div id="search-expandable" class="nav-wrapper blue hidden" style="padding: 0 20px; height: 50px; display: flex; align-items: center;">
                <input id="search-input" type="text" placeholder="Buscar na Bíblia..." class="white" style="border-radius: 4px; padding: 0 15px; height: 35px; flex: 1; margin-right: 10px; margin-top: 10px;">
            </div>

            <ul class="sidenav center" id="mobile-menu">
                <li><a onclick="load_random_chapter();" class="btn blue">Capítulo do Dia</a></li>
                <li><a id="mobile-search-btn" class="btn blue" href="/biblia-pwa/pages/search.html">Buscar na Bíblia</a></li>
            </ul>

            <h3 id="book_name" class="book_name ancizar-sans-font"></h3>
            <h4 id="book_subname" class="book_name ancizar-sans-font"></h4>
            
            <div id="chapter_selection" class="chapter_selection">
                <h5 id="chapter_title" class="chapter_title ancizar-sans-font hidden_before_load">Capítulos:</h5>
            </div>

            <div id="templates" style="visibility: hidden;">
                <a id="template_chapter_name_list" class="chapter_name_list ancizar-sans-font"></a>
            </div>
        </div>

        <script type="text/javascript" src="/biblia-pwa/js/materialize.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var elems = document.querySelectorAll('.sidenav');
                var instances = M.Sidenav.init(elems);
            });
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var searchIconBtn = document.getElementById('search-icon-btn');
                var mobileSearchBtn = document.getElementById('mobile-search-btn');
                var searchExpandable = document.getElementById('search-expandable');
                var searchInput = document.getElementById('search-input');
                var isExpanded = false;

                function performSearch() {
                    var query = searchInput.value.trim();
                    if (query) {
                        window.location.href = '/biblia-pwa/pages/search.html?query=' + encodeURIComponent(query);
                    }
                }

                if (searchIconBtn) {
                    searchIconBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        isExpanded = !isExpanded;
                        if (isExpanded) {
                            searchExpandable.classList.remove('hidden');
                            setTimeout(function() {
                                searchInput.focus();
                            }, 100);
                        } else {
                            searchExpandable.classList.add('hidden');
                        }
                    });
                }

                if (searchInput) {
                    searchInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            performSearch();
                        }
                    });
                }

                if (mobileSearchBtn) {
                    mobileSearchBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        var query = '';
                        if (searchInput) {
                            query = searchInput.value.trim();
                        }
                        window.location.href = '/biblia-pwa/pages/search.html?query=' + encodeURIComponent(query);
                    });
                }
            });
        </script>
    </body>
</html>
